>×</button><p class="eyebrow">Памятка-алгоритм</p><h2 id="theoryTitle">Н и НН: полные и краткие формы</h2><div class="memo-view"><img id="memoImage" alt="Памятка Н и НН, страница 1"><nav class="theory-nav" aria-label="Страницы памятки"><button data-page="0" class="active" aria-pressed="true">1</button><button data-page="1" aria-pressed="false">2</button></nav></div></div></section><script>const tasks=[{"id":"nn15-th-1","kind":"multi","prompt":"Какие условия приводят к написанию НН в причастии?","answers":["приставка, кроме не-","зависимое слово","суффикс -ова-/-ева-","образование от глагола совершенного вида","положение после существительного"],"correct":[0,1,2,3],"explain":"В полной форме причастия НН пишется при наличии приставки, кроме не-, зависимого слова, суффикса -ова-/-ева- или при образовании от глагола совершенного вида. Положение после существительного не является условием НН."},{"id":"nn15-th-2","kind":"multi","prompt":"Что нужно установить до применения правила Н/НН?","answers":["на какой вопрос отвечает слово","от чего образовано слово","стоит ли слово до существительного"],"correct":[0,1],"explain":"Сначала установите, на какой вопрос отвечает слово и от чего оно образовано. Остальные признаки проверяются затем."},{"id":"nn15-th-3","kind":"multi","prompt":"Какие утверждения о краткой форме верны?","answers":["в кратком страдательном причастии пишется одна Н","краткое прилагательное сохраняет Н или НН полной формы","исполнитель действия помогает распознать причастие","любая краткая форма пишется с одной Н"],"correct":[0,1,2],"explain":"Нужно различать краткое причастие со значением действия и краткое прилагательное со значением качества."},{"id":"nn15-th-4","kind":"truth","prompt":"Приставка НЕ- сама по себе не является условием написания НН.","correct":true,"explain":"Сравните: крашеный — некрашеный, но покрашенный."},{"id":"nn15-th-5","kind":"truth","prompt":"Чтобы выбрать Н или НН, достаточно посмотреть, есть ли рядом существительное.","correct":false,"explain":"Нужны форма слова, его значение и словообразовательные условия."},{"id":"nn15-th-6","kind":"truth","prompt":"Кова(н/нн)ый и жёва(н/нн)ый пишутся с НН, так как содержат суффиксы -ова-/-ева-.","correct":false,"explain":"Ложь. В словах кованый и жёваный нет суффиксов -ова-/-ева-. Без других условий для НН в них пишется одна Н."}]; const $=s=>document.querySelector(s);const $$=s=>[...document.querySelectorAll(s)]; let order=[],index=0,selected=new Set(),phase='answer',attempts=0,errors=0;function start(){order=tasks.slice();index=0;attempts=0;errors=0;render()}function render(){phase='answer';selected=new Set();const t=order[index];$('#quest').innerHTML='<div class="quest-head"><h3>Карта правила</h3><span class="counter">'+(index+1)+' / '+order.length+'</span></div><p>'+t.prompt+'</p>'+(t.kind==='multi'?'<div class="answers">'+t.answers.map((text,i)=>({text,i})).map(a=>'<button class="answer" data-answer="'+a.i+'" aria-pressed="false">'+a.text+'</button>').join('')+'</div>':'<div class="truth-stage"><button class="truth-option" data-answer="true">ПРАВДА</button><button class="truth-option" data-answer="false">ЛОЖЬ</button></div>')+'<div class="feedback" id="feedback" role="status" aria-live="polite"></div>';$$('[data-answer]').forEach(b=>b.onclick=()=>{if(phase!=='answer')return;const key=t.kind==='multi'?Number(b.dataset.answer):b.dataset.answer==='true';if(t.kind==='truth'){selected.clear();$$('[data-answer]').forEach(x=>{x.classList.remove('selected');x.setAttribute('aria-pressed','false')})}if(selected.has(key)){selected.delete(key);b.classList.remove('selected');b.setAttribute('aria-pressed','false')}else{selected.add(key);b.classList.add('selected');b.setAttribute('aria-pressed','true')}});$('#checkAnswer').hidden=false;$('#checkAnswer').textContent='Проверить';$('#restart').hidden=false}function check(){if(phase==='retry'){render();return}if(phase==='correct'){index++;index<order.length?render():finish();return}if(!selected.size){$('#feedback').text
